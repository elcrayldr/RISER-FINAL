name: Build RiserLab VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target RiserLab_VST3 --parallel 2

      - name: Upload VST3 plugin
        uses: actions/upload-artifact@v4
        with:
          name: RiserLab-Windows-x64-VST3
          path: build/RiserLab_artefacts/Release/VST3/
          if-no-files-found: error
          compression-level: 6
